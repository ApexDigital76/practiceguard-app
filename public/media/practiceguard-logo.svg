<svg width="680" height="680" viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="680" height="680" fill="#0b2340"/>

  <!-- Shield fill — wider: 130 to 550 -->
  <path d="M340 90 L130 165 L130 340 C130 455 220 540 340 578 C460 540 550 455 550 340 L550 165 Z"
        fill="#14b8a6" fill-opacity="0.15"/>

  <!-- Shield outline -->
  <path d="M340 90 L130 165 L130 340 C130 455 220 540 340 578 C460 540 550 455 550 340 L550 165 Z"
        fill="none" stroke="#14b8a6" stroke-width="18" stroke-linejoin="round"/>

  <!-- Medical cross - vertical bar -->
  <rect x="312" y="215" width="56" height="210" rx="10" fill="#14b8a6"/>

  <!-- Medical cross - horizontal bar -->
  <rect x="228" y="285" width="224" height="56" rx="10" fill="#14b8a6"/>

  <!-- PracticeGuard text -->
  <text x="340" y="628" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700"
        fill="#ffffff" letter-spacing="1">PracticeGuard</text>

  <!-- Compliance Group text -->
  <text x="340" y="666" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400"
        fill="#14b8a6" letter-spacing="3">COMPLIANCE GROUP</text>
</svg>
