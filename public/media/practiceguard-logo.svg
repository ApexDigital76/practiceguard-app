<svg width="680" height="680" viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="680" height="680" fill="#0b1b3a"/>

  <!-- Shield outline -->
  <path d="M340 80 L120 150 L120 340 C120 470 220 560 340 610 C460 560 560 470 560 340 L560 150 Z"
        fill="#22D3EE" fill-opacity="0.08" stroke="#22D3EE" stroke-width="14" stroke-linejoin="round"/>

  <!-- Mesh grid -->
  <g stroke="#22D3EE" stroke-width="3" opacity="0.75">
    <path d="M180 200 H500"/>
    <path d="M160 280 H520"/>
    <path d="M160 360 H520"/>
    <path d="M180 440 H500"/>
    <path d="M220 520 H460"/>
    <path d="M250 140 V540"/>
    <path d="M340 100 V580"/>
    <path d="M430 140 V540"/>
    <path d="M180 200 L340 360 L500 200"/>
    <path d="M160 280 L340 440 L520 280"/>
    <path d="M160 360 L340 520 L520 360"/>
  </g>

  <!-- Nodes -->
  <g fill="#22D3EE">
    <circle cx="250" cy="200" r="8"/>
    <circle cx="340" cy="160" r="9"/>
    <circle cx="430" cy="200" r="8"/>
    <circle cx="190" cy="280" r="7"/>
    <circle cx="340" cy="280" r="9"/>
    <circle cx="490" cy="280" r="7"/>
    <circle cx="190" cy="360" r="7"/>
    <circle cx="340" cy="360" r="10"/>
    <circle cx="490" cy="360" r="7"/>
    <circle cx="250" cy="440" r="7"/>
    <circle cx="340" cy="440" r="9"/>
    <circle cx="430" cy="440" r="7"/>
    <circle cx="290" cy="520" r="6"/>
    <circle cx="390" cy="520" r="6"/>
  </g>

  <!-- Pulse line through both sides -->
  <path d="M40 360 H140 L170 300 L210 420 L250 260 L340 480 L430 260 L470 420 L510 300 L540 360 H640"
        fill="none" stroke="#22D3EE" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark -->
  <text x="340" y="650" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700"
        letter-spacing="1">
    <tspan fill="#ffffff">Practice</tspan><tspan fill="#22D3EE">Guard</tspan>
  </text>
</svg>
